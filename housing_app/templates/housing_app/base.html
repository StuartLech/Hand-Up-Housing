{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>HUH Connect MadCo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Load Bootstrap CSS from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">

</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-custom">
    <div class="container-fluid">
      <!-- Brand on the left -->
      <a class="navbar-brand fw-bold" href="{% url 'housing_app:listing_list' %}">
        HUH Connect MadCo
      </a>

      <!-- Navbar toggler for mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarContent"
              aria-controls="navbarContent" aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Right side: Admin/Login/Register buttons -->
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav ms-auto d-flex align-items-center">
          {% if user.is_authenticated %}
            <!-- If logged in, show Admin and Logout -->
            <li class="nav-item me-2">
              <a class="btn btn-outline-light btn-sm" href="{% url 'admin:index' %}">
                Admin
              </a>
            </li>
            <li class="nav-item me-2">
              <form method="POST" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">
                  Logout
                </button>
              </form>
            </li>
          {% else %}
            <!-- If not logged in, show Login and Register -->
            <li class="nav-item me-2">
              <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">
                Login
              </a>
            </li>
            <li class="nav-item me-2">
              <a class="btn btn-outline-light btn-sm" href="{% url 'housing_app:register' %}">
                Register
              </a>
            </li>
          {% endif %}
          <li class="nav-item me-2">
            <button id="theme-toggle" class="btn btn-outline-light btn-sm" onclick="toggleTheme()">Light Mode</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main content area -->
  <div class="container">
    <div class="page-card card-3d">
      {% block content %}
      {% endblock %}
    </div>
  </div>

  <!-- Bootstrap JS Bundle (with Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/theme-toggle.js' %}"></script>
</body>
</html>
