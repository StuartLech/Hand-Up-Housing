{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>HUHConnectMadco</title>
  <!-- Load Bootstrap CSS from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">

  <style>
    /* Body background: very dark gray */
    body {
      background-color: #1a1a1a;
      color: #fff; /* text color white */
      margin: 0;
      padding: 0;
    }

    /* Navbar: darker background */
    .navbar-dark.bg-custom {
      background-color: #2b3940; /* dark gray-blue */
    }

    /* Brand link color (a bright accent) */
    .navbar-brand {
      color: #3dc3ff !important;
    }

    /* Main content “card” area styling */
    .page-card {
      background: #2c2c2c;  /* dark gray */
      color: #fff;          /* text remains white */
      border-radius: 8px;
      padding: 2rem;
      margin-top: 2rem;
      margin-bottom: 2rem;
    }

    /* Darker form controls */
    .form-control,
    .form-select {
      background-color: #444;
      color: #fff;
      border: 1px solid #555;
    }
    .form-control::placeholder {
      color: #ccc;
    }

    /* Primary button styling */
    .btn-primary {
      background-color: #007bff;
      border-color: #007bff;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }

    /* Outline-light buttons for top-right that blend with navbar */
    .btn-outline-light {
      border-color: #fff;
      color: #fff;
    }
    .btn-outline-light:hover {
      background-color: #fff;
      color: #000;
    }

    /* Light mode overrides */
    body.light-mode {
      background-color: #f8f9fa;
      color: #000;
    }
    body.light-mode .navbar-dark.bg-custom {
      background-color: #e9ecef;
    }
    body.light-mode .navbar-dark .navbar-brand {
      color: #007bff !important;
    }
    body.light-mode .page-card {
      background: #fff;
      color: #000;
    }
    body.light-mode .form-control,
    body.light-mode .form-select {
      background-color: #fff;
      color: #000;
      border: 1px solid #ced4da;
    }
    body.light-mode .form-control::placeholder {
      color: #6c757d;
    }
    body.light-mode .btn-outline-light {
      border-color: #000;
      color: #000;
    }
    body.light-mode .btn-outline-light:hover {
      background-color: #000;
      color: #fff;
    }
    body.light-mode table.table-dark {
      background-color: #fff;
      color: #000;
    }
    body.light-mode .bg-dark {
      background-color: #fff !important;
    }
    body.light-mode .text-white {
      color: #000 !important;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-custom">
    <div class="container-fluid">
      <!-- Brand on the left -->
      <a class="navbar-brand fw-bold" href="{% url 'housing_app:listing_list' %}">
        HUH Connect Madco
      </a>

      <!-- Navbar toggler for mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarContent"
              aria-controls="navbarContent" aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Right side: Admin/Login/Register buttons -->
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav ms-auto d-flex align-items-center">
          {% if user.is_authenticated %}
            <!-- If logged in, show Admin and Logout -->
            <li class="nav-item me-2">
              <a class="btn btn-outline-light btn-sm" href="{% url 'admin:index' %}">
                Admin
              </a>
            </li>
            <li class="nav-item me-2">
              <form method="POST" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">
                  Logout
                </button>
              </form>
            </li>
          {% else %}
            <!-- If not logged in, show Login and Register -->
            <li class="nav-item me-2">
              <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">
                Login
              </a>
            </li>
            <li class="nav-item me-2">
              <a class="btn btn-outline-light btn-sm" href="{% url 'housing_app:register' %}">
                Register
              </a>
            </li>
          {% endif %}
          <li class="nav-item me-2">
            <button id="theme-toggle" class="btn btn-outline-light btn-sm" onclick="toggleTheme()">Light Mode</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main content area -->
  <div class="container">
    <div class="page-card">
      {% block content %}
      {% endblock %}
    </div>
  </div>

  <!-- Bootstrap JS Bundle (with Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/theme-toggle.js' %}"></script>
</body>
</html>
